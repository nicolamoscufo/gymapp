name: Fix final UI analyzer regression

on:
  push:
    branches:
      - refactor/workout-ui-foundation

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[fix-ui-analyzer]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/workout-ui-foundation
          fetch-depth: 0
      - name: Restore dark-mode flag used by metric icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/stats.dart')
          text = p.read_text()
          old = "    final theme = Theme.of(context);\n    final colorScheme = theme.colorScheme;\n\n    return Card(\n      child: Container("
          new = "    final theme = Theme.of(context);\n    final colorScheme = theme.colorScheme;\n    final isDark = theme.brightness == Brightness.dark;\n\n    return Card(\n      child: Container("
          if old not in text:
              raise SystemExit('stats metric anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "gymapp-refactor"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/stats.dart
          git commit -m "Fix stats dark-mode metric styling [fix-ui-analyzer]"
          git push origin HEAD:refactor/workout-ui-foundation
