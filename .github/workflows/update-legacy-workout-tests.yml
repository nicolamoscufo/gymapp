name: Update Legacy Workout Tests

on:
  push:
    branches:
      - feature/next-session-plan-review

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/next-session-plan-review
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Update legacy tests
        run: python3 .github/scripts/update_legacy_workout_tests.py
      - name: Format
        run: dart format test/home_undo_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Run legacy workout tests
        run: flutter test test/home_undo_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Commit test updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No test changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/home_undo_test.dart
          git commit -m "Align legacy workout tests with current live UX"
          git push origin HEAD:feature/next-session-plan-review
