name: Validate AI model hardening

on:
  push:
    branches:
      - feature/ai-model-hardening

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-model-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Finalize model management typing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/ai_model_management.dart')
          text = path.read_text()
          text = text.replace(
              'class _ModelIdentityCard extends StatelessWidget {\n  final AiCoachModelInstaller installer;',
              'class _ModelIdentityCard extends StatelessWidget {\n  final AiCoachManagedModelInstaller installer;',
              1,
          )
          text = text.replace(
              '''      final onProgress = (int progress) {
                if (!mounted) return;
                setState(() => _progress = progress.clamp(0, 100));
              };
          ''',
              '''      void onProgress(int progress) {
                if (!mounted) return;
                setState(() => _progress = progress.clamp(0, 100));
              }
          ''',
              1,
          )
          path.write_text(text)
          PY
          dart format lib/screens/ai_model_management.dart

      - name: Commit final typing fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/ai_model_management.dart
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalize managed model UI typing"
            git push origin HEAD:feature/ai-model-hardening
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compile Android debug APK
        run: flutter build apk --debug
