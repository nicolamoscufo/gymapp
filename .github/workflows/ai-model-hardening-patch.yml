name: Validate AI model hardening

on:
  push:
    branches:
      - feature/ai-model-hardening

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-model-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix final lint
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('lib/screens/ai_model_management.dart'); t=p.read_text(); t=t.replace('final onProgress = (int progress) {','void onProgress(int progress) {',1).replace('      };\n      if (reinstall)','      }\n      if (reinstall)',1); p.write_text(t)"
          dart format lib/screens/ai_model_management.dart

      - name: Commit lint fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/ai_model_management.dart
          if ! git diff --cached --quiet; then
            git commit -m "fix: use named model download progress callback"
            git push origin HEAD:feature/ai-model-hardening
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compile Android debug APK
        run: flutter build apk --debug
