name: Apply AI model hardening patch

on:
  push:
    branches:
      - feature/ai-model-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-model-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch AI Coach lifecycle wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/ai_coach.dart')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Patch anchor not found: {label}')
              text = text.replace(old, new, 1)

          def replace_between(start_marker, end_marker, replacement, label):
              global text
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'Patch start not found: {label}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'Patch end not found: {label}')
              text = text[:start] + replacement + text[end:]

          replace_once(
              "import 'ai_program_draft_review.dart';\n",
              "import 'ai_program_draft_review.dart';\nimport 'ai_model_management.dart';\n",
              'management import',
          )

          replace_once(
              "  int? _downloadProgress;\n  String? _errorMessage;\n",
              "  int? _downloadProgress;\n  AiModelHealthReport _modelHealth = AiModelHealthReport.notInstalled();\n  String? _errorMessage;\n",
              'health field',
          )

          replace_between(
              '  Future<void> _refreshModelState() async {',
              '  Future<void> _downloadModel() async {',
              '''  Future<void> _refreshModelState() async {
            try {
              await widget.modelInstaller.initialize();
              final recovery = await widget.modelInstaller.recoverInterruptedState();
              final isInstalled = await widget.modelInstaller.isInstalled();
              final health = isInstalled
                  ? await widget.modelInstaller.verifyInstallation()
                  : AiModelHealthReport.notInstalled();
              if (!mounted) return;
              setState(() {
                _isModelInstalled = isInstalled;
                _modelHealth = health;
                _isCheckingModel = false;
                _modelChecked = true;
                if (recovery.userMessage != null) {
                  _errorMessage = recovery.userMessage;
                } else if (isInstalled &&
                    health.status != AiModelHealthStatus.healthy) {
                  _errorMessage = health.message;
                }
              });
              _maybeStartLaunchHandoff();
            } catch (error) {
              if (!mounted) return;
              setState(() {
                _isModelInstalled = false;
                _modelHealth = AiModelHealthReport.notInstalled();
                _isCheckingModel = false;
                _modelChecked = true;
                _errorMessage = 'Impossibile verificare il modello locale: $error';
              });
            }
          }

          ''',
              'refresh model state',
          )

          replace_between(
              '  Future<void> _downloadModel() async {',
              '  Future<void> _startNewConversation() async {',
              '''  Future<void> _downloadModel() async {
            if (_isDownloadingModel) return;

            final preflight = await widget.modelInstaller.preflight();
            if (!mounted) return;
            if (!preflight.canInstall) {
              setState(() => _errorMessage = preflight.userSummary);
              return;
            }
            if (preflight.needsConfirmation) {
              final continueDownload = await showDialog<bool>(
                    context: context,
                    builder: (context) => AlertDialog(
                      title: const Text('Compatibilità non ideale'),
                      content: Text(
                        '${preflight.warnings.join('\\n\\n')}\\n\\nVuoi continuare comunque?',
                      ),
                      actions: [
                        TextButton(
                          onPressed: () => Navigator.pop(context, false),
                          child: const Text('Annulla'),
                        ),
                        FilledButton(
                          onPressed: () => Navigator.pop(context, true),
                          child: const Text('Continua'),
                        ),
                      ],
                    ),
                  ) ??
                  false;
              if (!continueDownload) return;
            }

            setState(() {
              _isDownloadingModel = true;
              _downloadProgress = 0;
              _errorMessage = null;
            });

            try {
              await widget.modelInstaller.install(
                onProgress: (progress) {
                  if (!mounted) return;
                  setState(() => _downloadProgress = progress.clamp(0, 100));
                },
              );
              final health = await widget.modelInstaller.verifyInstallation();
              if (!mounted) return;
              setState(() {
                _isModelInstalled = true;
                _modelHealth = health;
                _downloadProgress = 100;
                _modelChecked = true;
              });
              _maybeStartLaunchHandoff();
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(
                    '${widget.modelInstaller.modelName} installato e verificato.',
                  ),
                ),
              );
            } on AiModelInstallException catch (error) {
              if (!mounted) return;
              setState(() => _errorMessage = error.message);
            } catch (error) {
              if (!mounted) return;
              setState(() => _errorMessage = 'Download del modello fallito: $error');
            } finally {
              if (mounted) setState(() => _isDownloadingModel = false);
            }
          }

          Future<void> _openModelManagement() async {
            await Navigator.of(context).push(
              MaterialPageRoute(
                builder: (_) => AiModelManagementScreen(
                  installer: widget.modelInstaller,
                ),
              ),
            );
            if (!mounted) return;
            setState(() => _isCheckingModel = true);
            await _refreshModelState();
          }

          ''',
              'download model',
          )

          send_start = text.find('  Future<void> _sendMessage() async {')
          send_end = text.find('  String _programDraftKey', send_start)
          if send_start < 0 or send_end < 0:
              raise SystemExit('Could not isolate _sendMessage')
          send = text[send_start:send_end]
          old = '    await _saveAndRefresh(conversation);\n\n    try {\n'
          if old not in send:
              raise SystemExit('Chat inference-start anchor not found')
          send = send.replace(
              old,
              '    await _saveAndRefresh(conversation);\n    await widget.modelInstaller.markInferenceStarted();\n\n    try {\n',
              1,
          )
          old_catch = '''    } catch (_) {
            if (!mounted) return;
            setState(() {
              _isRunning = false;
              _errorMessage = 'Failed to get response. Please try again.';
            });
          }
          '''
          if old_catch not in send:
              # Match the source indentation-independent suffix by its stable error string.
              marker = "        _errorMessage = 'Failed to get response. Please try again.';"
              pos = send.find(marker)
              if pos < 0:
                  raise SystemExit('Chat inference-finish anchor not found')
              close = send.find('\n    }\n', pos)
              if close < 0:
                  raise SystemExit('Chat catch closing brace not found')
              close += len('\n    }\n')
              send = send[:close] + '    finally {\n      await widget.modelInstaller.markInferenceFinished();\n    }\n' + send[close:]
          else:
              send = send.replace(
                  old_catch,
                  old_catch[:-4] + ' finally {\n      await widget.modelInstaller.markInferenceFinished();\n    }\n',
                  1,
              )
          text = text[:send_start] + send + text[send_end:]

          plan_start = text.find('  Future<void> _reviewPlanAdjustments() async {')
          plan_end = text.find('  @override\n  Widget build(BuildContext context)', plan_start)
          if plan_start < 0 or plan_end < 0:
              raise SystemExit('Could not isolate _reviewPlanAdjustments')
          plan = text[plan_start:plan_end]
          state_anchor = '''    setState(() {
            _isAnalyzingPlan = true;
            _errorMessage = null;
          });
          '''
          # Source is two-space method indentation; normalize using shorter stable anchor.
          short = '    setState(() {\n      _isAnalyzingPlan = true;\n      _errorMessage = null;\n    });\n'
          if short not in plan:
              raise SystemExit('Plan inference-start anchor not found')
          plan = plan.replace(
              short,
              short + '    await widget.modelInstaller.markInferenceStarted();\n',
              1,
          )
          final_old = '    } finally {\n      if (mounted) setState(() => _isAnalyzingPlan = false);\n    }\n'
          if final_old not in plan:
              raise SystemExit('Plan inference-finish anchor not found')
          plan = plan.replace(
              final_old,
              '    } finally {\n      await widget.modelInstaller.markInferenceFinished();\n      if (mounted) setState(() => _isAnalyzingPlan = false);\n    }\n',
              1,
          )
          text = text[:plan_start] + plan + text[plan_end:]

          replace_once(
              "          IconButton(\n            icon: const Icon(Icons.edit_outlined),\n            tooltip: 'Edit profile',\n            onPressed: _editProfile,\n          ),\n",
              "          if (widget.modelInstaller.canManageModel)\n            IconButton(\n              key: const ValueKey('ai-model-management'),\n              icon: Icon(\n                _modelHealth.isHealthy\n                    ? Icons.verified_user_outlined\n                    : Icons.settings_suggest_outlined,\n              ),\n              tooltip: 'Gestisci modello AI locale',\n              onPressed: _isDownloadingModel ? null : _openModelManagement,\n            ),\n          IconButton(\n            icon: const Icon(Icons.edit_outlined),\n            tooltip: 'Edit profile',\n            onPressed: _editProfile,\n          ),\n",
              'management button',
          )

          ready_first = '''          else if (_isModelInstalled && _allConversations.isEmpty)
            _ModelReadyBanner(theme: theme, colorScheme: colorScheme)
          else if (_errorMessage != null)
            _ErrorBanner(
          '''
          error_first = '''          else if (_errorMessage != null)
            _ErrorBanner(
          '''
          if ready_first in text:
              text = text.replace(ready_first, error_first, 1)
              dismiss = '''              onDismiss: () => setState(() => _errorMessage = null),
            ),
          if (_isDownloadingModel && _downloadProgress != null)
          '''
              replacement = '''              onDismiss: () => setState(() => _errorMessage = null),
            )
          else if (_isModelInstalled && _allConversations.isEmpty)
            _ModelReadyBanner(theme: theme, colorScheme: colorScheme),
          if (_isDownloadingModel && _downloadProgress != null)
          '''
              if dismiss not in text:
                  raise SystemExit('Error-banner reorder anchor not found')
              text = text.replace(dismiss, replacement, 1)

          path.write_text(text)
          PY

          dart format lib/screens/ai_coach.dart lib/screens/ai_model_management.dart lib/ai_coach/ai_coach_model_manager.dart test/ai_model_hardening_test.dart

      - name: Commit wired lifecycle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/ai_coach.dart lib/screens/ai_model_management.dart lib/ai_coach/ai_coach_model_manager.dart test/ai_model_hardening_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "feat: wire resilient AI model lifecycle"
            git push origin HEAD:feature/ai-model-hardening
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compile Android debug APK
        run: flutter build apk --debug
