name: Workout Home Refactor Build

on:
  push:
    branches:
      - refactor/workout-home-foundations

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/workout-home-foundations

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply refactor
        run: python tool/refactor_foundations.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib/active_workout_insights.dart lib/home_data_policy.dart lib/screens/active_workout.dart lib/screens/home.dart test/refactor_foundations_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/active_workout_insights.dart lib/home_data_policy.dart lib/screens/active_workout.dart lib/screens/home.dart test/refactor_foundations_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "Refactor workout insights and home data policy"
          git push origin HEAD:refactor/workout-home-foundations
