name: AI Coach Historical Context

on:
  push:
    branches:
      - feature/ai-coach-historical-context

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-coach-historical-context
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fix historical context patch anchors
        run: python3 .github/scripts/fix_ai_coach_historical_context_patch.py
      - name: Fix AI Coach service patch anchors
        run: python3 .github/scripts/fix_ai_coach_service_patch.py
      - name: Apply historical Coach context
        run: python3 .github/scripts/add_ai_coach_historical_context.py
      - name: Format
        run: dart format lib/ai_coach/program_history_context.dart lib/ai_coach/training_context_builder.dart lib/ai_coach/local_ai_coach_service.dart lib/screens/ai_coach.dart lib/screens/ai_coach_entry.dart test/program_history_context_test.dart test/ai_coach_test.dart test/ai_coach_handoff_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Run focused tests
        run: flutter test test/program_history_context_test.dart test/ai_coach_test.dart test/ai_coach_handoff_test.dart test/progress_ai_context_test.dart test/schedule_version_history_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai_coach/program_history_context.dart lib/ai_coach/training_context_builder.dart lib/ai_coach/local_ai_coach_service.dart lib/screens/ai_coach.dart lib/screens/ai_coach_entry.dart test/program_history_context_test.dart test/ai_coach_test.dart test/ai_coach_handoff_test.dart
          git commit -m "Add complete historical context to AI Coach"
          git push origin HEAD:feature/ai-coach-historical-context
