name: Period and Mesocycle Comparison

on:
  push:
    branches:
      - feature/period-mesocycle-comparison

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/period-mesocycle-comparison
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply period comparison
        run: python3 .github/scripts/add_period_mesocycle_comparison.py
      - name: Format
        run: dart format lib/progress_analytics.dart lib/progress_period_comparison.dart lib/screens/progress_center.dart lib/screens/home.dart test/progress_period_comparison_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Run focused tests
        run: flutter test test/progress_period_comparison_test.dart test/progress_center_test.dart test/progress_drilldown_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/progress_analytics.dart lib/progress_period_comparison.dart lib/screens/progress_center.dart lib/screens/home.dart test/progress_period_comparison_test.dart
          git commit -m "Add period and mesocycle comparison"
          git push origin HEAD:feature/period-mesocycle-comparison
