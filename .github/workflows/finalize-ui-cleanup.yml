name: Finalize UI cleanup

on:
  push:
    branches:
      - refactor/workout-ui-foundation

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[final-ui-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/workout-ui-foundation
          fetch-depth: 0

      - name: Apply cleanup
        run: python3 tool/finalize_ui_cleanup.py

      - name: Commit cleanup
        run: |
          git config user.name "gymapp-refactor"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/home.dart lib/screens/stats.dart lib/screens/session_summary.dart lib/screens/schedule_detail.dart test/home_undo_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize gym-first UI cleanup [final-ui-cleanup]"
          git push origin HEAD:refactor/workout-ui-foundation
