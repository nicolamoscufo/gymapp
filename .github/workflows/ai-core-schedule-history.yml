name: AI Core Schedule History

on:
  push:
    branches:
      - feature/ai-core-schedule-history

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-core-schedule-history
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply backup and migration coverage
        run: python3 .github/scripts/add_schedule_history_backup_restore.py
      - name: Format
        run: dart format lib/schedule_version_history.dart lib/screens/home.dart test/schedule_version_history_test.dart test/local_sqlite_store_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Run focused tests
        run: flutter test test/schedule_version_history_test.dart test/local_sqlite_store_test.dart test/home_undo_test.dart test/active_workout_session_builder_test.dart test/ai_plan_action_service_test.dart test/post_workout_next_session_plan_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/schedule_version_history.dart lib/screens/home.dart test/schedule_version_history_test.dart test/local_sqlite_store_test.dart
          git commit -m "Preserve schedule history across backup restore"
          git push origin HEAD:feature/ai-core-schedule-history
