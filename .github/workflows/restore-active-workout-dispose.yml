name: Restore Active Workout Dispose

on:
  push:
    branches:
      - feature/next-session-plan-review

permissions:
  contents: write

jobs:
  restore-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/next-session-plan-review
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore dispose
        run: python3 .github/scripts/restore_active_workout_dispose.py
      - name: Format
        run: dart format lib/screens/active_workout.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Run workout regressions
        run: flutter test test/workout_ux_polish_v2_test.dart test/active_workout_screen_test.dart test/post_workout_next_session_plan_test.dart
      - name: Analyze
        run: dart analyze
      - name: Commit restored source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/active_workout.dart
          git commit -m "Restore Active Workout lifecycle cleanup"
          git push origin HEAD:feature/next-session-plan-review
