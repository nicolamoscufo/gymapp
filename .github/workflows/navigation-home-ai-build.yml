name: Navigation and Home redesign

on:
  push:
    branches:
      - feat/navigation-home-ai

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/navigation-home-ai

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply navigation redesign
        shell: python
        run: |
          from pathlib import Path

          home = Path('lib/screens/home.dart')
          text = home.read_text()

          if "import 'ai_coach.dart';" not in text:
              text = text.replace(
                  "import 'active_workout.dart';\n",
                  "import 'active_workout.dart';\nimport 'ai_coach.dart';\n",
              )

          text = text.replace(
              "  final ValueChanged<ThemeMode>? onThemeModeChanged;\n\n  const HomePage({\n    super.key,\n    this.themeMode = AppPreferences.defaultThemeMode,\n    this.onThemeModeChanged,\n  });",
              "  final ValueChanged<ThemeMode>? onThemeModeChanged;\n  final int initialIndex;\n\n  const HomePage({\n    super.key,\n    this.themeMode = AppPreferences.defaultThemeMode,\n    this.onThemeModeChanged,\n    this.initialIndex = 1,\n  });",
          )
          text = text.replace(
              "  int _currentIndex = 0;\n  String _searchQuery = '';",
              "  int _currentIndex = 1;\n  int _progressIndex = 0;\n  String _searchQuery = '';",
          )
          text = text.replace(
              "  void initState() {\n    super.initState();\n    _loadData();\n  }",
              "  void initState() {\n    super.initState();\n    _currentIndex = widget.initialIndex.clamp(0, 4);\n    _loadData();\n  }",
          )

          marker = "\n  @override\n  Widget build(BuildContext context) {"
          start = text.rfind(marker)
          end_marker = "\n}\n\nclass _ExerciseOccurrence"
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise RuntimeError('Unable to locate HomePage build tail')

          new_tail = r'''

  bool _sameDay(DateTime a, DateTime b) {
    return a.year == b.year && a.month == b.month && a.day == b.day;
  }

  _PlannedWorkout? _nextPlannedWorkout() {
    final activeSchedules = schedules
        .where((schedule) => !schedule.isArchived && schedule.exercises.isNotEmpty)
        .toList();
    if (activeSchedules.isEmpty) {
      return null;
    }

    final now = DateTime.now();
    final today = DateTime(now.year, now.month, now.day);
    for (var offset = 0; offset <= 7; offset++) {
      final date = today.add(Duration(days: offset));
      for (final schedule in activeSchedules) {
        if (schedule.isPlannedOn(date)) {
          return _PlannedWorkout(schedule: schedule, date: date);
        }
      }
    }

    return _PlannedWorkout(schedule: activeSchedules.first, date: today);
  }

  int _workoutsThisWeek() {
    final now = DateTime.now();
    final today = DateTime(now.year, now.month, now.day);
    final startOfWeek = today.subtract(Duration(days: today.weekday - 1));
    final endOfWeek = startOfWeek.add(const Duration(days: 7));
    return history.where((session) {
      return !session.endTime.isBefore(startOfWeek) &&
          session.endTime.isBefore(endOfWeek);
    }).length;
  }

  BodyLog? _latestBodyLog() {
    if (bodyLogs.isEmpty) {
      return null;
    }
    return bodyLogs.reduce((a, b) => a.date.isAfter(b.date) ? a : b);
  }

  Future<void> _startScheduleFromHome(Schedule schedule) async {
    if (schedule.exercises.isEmpty) {
      await _showInfo('Aggiungi degli esercizi prima di iniziare.');
      return;
    }
    await Navigator.push(
      context,
      MaterialPageRoute(
        builder: (context) => ActiveWorkoutScreen(
          schedule: schedule,
          history: history,
          defaultRestSeconds: _defaultRestSeconds,
          defaultBackoffReductionPercent: _defaultBackoffReductionPercent,
        ),
      ),
    );
    if (mounted) {
      await _loadData();
    }
