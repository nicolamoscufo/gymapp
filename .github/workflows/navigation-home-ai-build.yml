      MaterialPageRoute(
        builder: (context) => ActiveWorkoutScreen.resume(
          resumedSession: session,
          history: history,
          defaultRestSeconds: _defaultRestSeconds,
          defaultBackoffReductionPercent: _defaultBackoffReductionPercent,
