name: Navigation and Home redesign

on:
  push:
    branches:
      - feat/navigation-home-ai

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/navigation-home-ai

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply redesign
        run: |
          python tool/navigation_home_patch.py
          python tool/navigation_patch_compat.py

      - name: Format
        run: dart format lib/screens/home.dart lib/screens/home_ai_shell.dart test/home_navigation_test.dart test/home_undo_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home.dart lib/screens/home_ai_shell.dart test/home_navigation_test.dart test/home_undo_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "Redesign Home and primary navigation"
          git push origin HEAD:feat/navigation-home-ai
