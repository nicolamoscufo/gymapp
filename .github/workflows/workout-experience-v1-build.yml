name: Workout Experience v1 build

on:
  push:
    branches:
      - feat/workout-experience-v1

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/workout-experience-v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply workout UI patch
        run: |
          python tool/workout_experience_patch.py
          python tool/workout_experience_test_patch.py

      - name: Format
        run: dart format lib/models/workout.dart lib/workout_plate_calculator.dart lib/screens/active_workout.dart test/workout_experience_v1_test.dart test/home_undo_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit workout experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/active_workout.dart lib/models/workout.dart lib/workout_plate_calculator.dart test/workout_experience_v1_test.dart test/home_undo_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "Build Hevy-style workout experience v1"
          git push origin HEAD:feat/workout-experience-v1
