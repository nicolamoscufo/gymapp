name: Patch AI generation profiles

on:
  push:
    branches:
      - feature/ai-generation-profiles

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ai-generation-profiles

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply generation profile patch
        run: python3 tool/patch_ai_generation_profiles.py

      - name: Format
        run: dart format lib/ai_coach/local_llm_engine.dart lib/ai_coach/ai_coach_generation_profile.dart test/ai_coach_generation_profile_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test generation profiles and Coach evals
        run: flutter test test/ai_coach_generation_profile_test.dart test/ai_coach_evaluation_suite_test.dart

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai_coach/local_llm_engine.dart lib/ai_coach/ai_coach_generation_profile.dart test/ai_coach_generation_profile_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire task-specific AI generation profiles"
          git push origin HEAD:feature/ai-generation-profiles
