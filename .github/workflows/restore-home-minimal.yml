name: Restore Minimal Home Diff

on:
  push:
    branches:
      - feature/period-mesocycle-comparison

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/period-mesocycle-comparison
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch main
        run: git fetch origin main --depth=1
      - name: Restore minimal Home diff
        run: python3 .github/scripts/restore_home_minimal.py
      - name: Install dependencies
        run: flutter pub get
      - name: Validate
        run: |
          flutter test test/progress_period_comparison_test.dart test/progress_center_test.dart
          flutter analyze
      - name: Commit Home cleanup
        shell: bash
        run: |
          if git diff --quiet -- lib/screens/home.dart; then
            echo "No Home cleanup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home.dart
          git commit -m "Keep Home period wiring minimal"
          git push origin HEAD:feature/period-mesocycle-comparison
