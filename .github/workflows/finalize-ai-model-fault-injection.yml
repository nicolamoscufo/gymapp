name: Finalize AI model fault injection

on:
  push:
    branches:
      - test/ai-model-fault-injection

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test/ai-model-fault-injection

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply final lifecycle patch
        run: python3 tool/close_ai_model_fault_gaps.py

      - name: Format
        run: dart format lib/ai_coach/ai_coach_model_manager.dart lib/screens/ai_model_management.dart test/ai_model_fault_injection_test.dart test/ai_model_download_navigation_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run lifecycle tests
        run: flutter test test/ai_model_fault_injection_test.dart test/ai_model_execution_coordinator_test.dart test/ai_model_download_navigation_test.dart test/ai_model_hardening_test.dart test/local_ai_inference_context_test.dart

      - name: Run full functional suite
        run: flutter test

      - name: Compile Android debug APK
        run: flutter build apk --debug

      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai_coach/ai_coach_model_manager.dart lib/screens/ai_model_management.dart test/ai_model_fault_injection_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Close AI model lifecycle fault injection gaps"
          git push origin HEAD:test/ai-model-fault-injection
