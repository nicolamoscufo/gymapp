name: Workout Experience v5 build

on:
  push:
    branches:
      - feat/fatigue-readiness-v5

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/fatigue-readiness-v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply fatigue readiness v5
        run: |
          python tool/workout_experience_v5_patch.py
          python tool/workout_experience_v5_fix.py
          python tool/workout_experience_v5_fix2.py

      - name: Format
        run: dart format lib/screens/active_workout.dart lib/screens/home.dart lib/screens/schedule_detail.dart lib/workout_fatigue_analytics.dart lib/ai_coach/training_context_builder.dart lib/ai_coach/ai_coach_prompts.dart test/workout_fatigue_analytics_test.dart test/workout_experience_v5_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit workout experience v5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/active_workout.dart lib/screens/home.dart lib/screens/schedule_detail.dart lib/workout_fatigue_analytics.dart lib/ai_coach/training_context_builder.dart lib/ai_coach/ai_coach_prompts.dart test/workout_fatigue_analytics_test.dart test/workout_experience_v5_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "Build workout experience v5"
          git push origin HEAD:feat/fatigue-readiness-v5
