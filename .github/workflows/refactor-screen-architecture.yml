name: Refactor screen architecture

on:
  push:
    branches:
      - refactor/screen-architecture

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/screen-architecture

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply deterministic refactor
        run: python3 tool/refactor_screen_architecture.py

      - name: Format migrated sources
        run: |
          dart format \
            lib/screens/active_workout.dart \
            lib/screens/home.dart \
            lib/active_workout_focus_controller.dart \
            lib/home_history_analytics.dart \
            lib/home_dashboard_state.dart \
            lib/ui/active_workout_input_components.dart \
            test/screen_architecture_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test extracted architecture
        run: flutter test test/screen_architecture_test.dart

      - name: Commit migrated screens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/screens/active_workout.dart \
            lib/screens/home.dart \
            lib/active_workout_focus_controller.dart \
            lib/home_history_analytics.dart \
            lib/home_dashboard_state.dart \
            lib/ui/active_workout_input_components.dart \
            test/screen_architecture_test.dart
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "Migrate screens to extracted architecture modules"
          git push origin HEAD:refactor/screen-architecture
