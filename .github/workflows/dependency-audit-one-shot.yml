name: Dependency audit one-shot

on:
  push:
    branches:
      - chore/dependency-audit

permissions:
  contents: write

jobs:
  safe-refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/dependency-audit

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Audit current dependency graph
        run: flutter pub outdated || true

      - name: Refresh low-risk packages inside existing constraints
        run: >-
          flutter pub upgrade
          csv
          file_picker
          fl_chart
          flutter_local_notifications
          share_plus
          shared_preferences
          sqflite
          timezone
          flutter_launcher_icons
          sqflite_common_ffi

      - name: Verify Gemma runtime remains pinned
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('pubspec.lock').read_text()
          for package, expected in {
              'flutter_gemma': '1.6.5',
              'flutter_gemma_litertlm': '1.5.2',
          }.items():
              match = re.search(rf'^  {package}:\n(?:.*\n)*?    version: "([^"]+)"', text, re.MULTILINE)
              if match is None:
                  raise SystemExit(f'{package}: missing from lockfile')
              actual = match.group(1)
              print(f'{package}={actual}')
              if actual != expected:
                  raise SystemExit(f'{package}: expected {expected}, got {actual}')
          PY

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify visual baselines
        env:
          GOLDEN_TESTS: '1'
        run: flutter test test/ui_visual_golden_test.dart

      - name: Show resulting direct versions
        run: |
          flutter pub outdated --no-dev-dependencies || true
          git diff -- pubspec.lock

      - name: Commit lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "No compatible lockfile refresh available."
            exit 0
          fi
          git commit -m "Refresh compatible Flutter dependencies"
          git push origin HEAD:chore/dependency-audit
