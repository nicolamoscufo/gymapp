name: Post Workout Intelligence

on:
  push:
    branches:
      - feature/post-workout-intelligence-v1

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/post-workout-intelligence-v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply debrief UI patch
        run: |
          python3 .github/scripts/post_workout_debrief_patch.py
          python3 .github/scripts/post_workout_debrief_import_fix.py

      - name: Format
        run: dart format lib/post_workout_debrief.dart lib/screens/session_summary.dart test/post_workout_debrief_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run focused tests
        run: flutter test test/post_workout_debrief_test.dart

      - name: Run session summary regressions
        run: flutter test test/session_summary_test.dart || test ! -f test/session_summary_test.dart

      - name: Analyze
        run: dart analyze

      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/post_workout_debrief.dart lib/screens/session_summary.dart test/post_workout_debrief_test.dart
          git commit -m "Add smart post-workout debrief"
          git push origin HEAD:feature/post-workout-intelligence-v1
