name: P0 AI actions and SQLite build

on:
  push:
    branches:
      - feat/p0-ai-actions-sqlite

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/p0-ai-actions-sqlite

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply P0 patch
        run: |
          python tool/p0_script_syntax_fix.py
          python tool/p0_patch.py
          python tool/p0_fix_patch.py
          python tool/p0_analyzer_fix.py
          python tool/p0_behavior_fix.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib/app_data_store.dart lib/local_sqlite_store.dart lib/ai_coach/ai_coach_models.dart lib/ai_coach/ai_coach_prompts.dart lib/ai_coach/local_ai_coach_service.dart lib/ai_coach/ai_plan_action_service.dart lib/screens/ai_coach.dart test/ai_plan_action_service_test.dart test/local_sqlite_store_test.dart test/ai_coach_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit P0 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock lib/app_data_store.dart lib/local_sqlite_store.dart lib/ai_coach/ai_coach_models.dart lib/ai_coach/ai_coach_prompts.dart lib/ai_coach/local_ai_coach_service.dart lib/ai_coach/ai_plan_action_service.dart lib/screens/ai_coach.dart test/ai_plan_action_service_test.dart test/local_sqlite_store_test.dart test/ai_coach_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "Implement P0 AI plan actions and SQLite storage"
          git push origin HEAD:feat/p0-ai-actions-sqlite
