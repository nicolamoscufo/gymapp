name: Apply workout UI refactor

on:
  push:
    branches:
      - refactor/workout-ui-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/workout-ui-foundation
          fetch-depth: 0

      - name: Apply refactor
        run: python3 tool/apply_workout_ui_refactor.py

      - name: Commit refactor
        run: |
          git config user.name "gymapp-refactor"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/active_workout.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refactor active workout UI [workout-ui-refactor]"
          git push origin HEAD:refactor/workout-ui-foundation
