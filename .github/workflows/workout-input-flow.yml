name: Workout Input Flow

on:
  push:
    branches:
      - feature/workout-input-flow

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workout-input-flow

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply workout input flow patch
        run: python3 .github/scripts/workout_input_flow_patch.py

      - name: Format
        run: dart format lib/screens/active_workout.dart test/workout_ux_polish_v2_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run focused tests
        run: flutter test test/workout_ux_polish_v2_test.dart test/active_workout_screen_test.dart

      - name: Analyze
        run: dart analyze

      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/active_workout.dart test/workout_ux_polish_v2_test.dart
          git commit -m "Streamline workout set input flow"
          git push origin HEAD:feature/workout-input-flow
