name: Active Workout Rest Controller Build

on:
  push:
    branches:
      - refactor/active-workout-rest-controller

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/active-workout-rest-controller

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply refactor
        run: python tool/refactor_rest_controller.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib/active_workout_rest_controller.dart lib/screens/active_workout.dart test/active_workout_rest_controller_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/active_workout_rest_controller.dart lib/screens/active_workout.dart test/active_workout_rest_controller_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "Refactor active workout rest timer controller"
          git push origin HEAD:refactor/active-workout-rest-controller
