name: Patch AI model fault injection

on:
  push:
    branches:
      - test/ai-model-fault-injection

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test/ai-model-fault-injection

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply lifecycle hardening patch
        run: |
          python3 tool/fix_fault_patcher_scope.py
          python3 tool/patch_ai_model_fault_injection.py

      - name: Format Dart
        run: dart format lib/ai_coach/ai_coach_model_manager.dart lib/ai_coach/local_llm_engine.dart lib/ai_coach/ai_model_execution_coordinator.dart test/ai_model_fault_injection_test.dart test/ai_model_execution_coordinator_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run lifecycle fault-injection tests
        run: flutter test test/ai_model_fault_injection_test.dart test/ai_model_execution_coordinator_test.dart test/ai_model_hardening_test.dart test/local_ai_inference_context_test.dart

      - name: Compile Android debug APK
        run: flutter build apk --debug

      - name: Commit permanent patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai_coach/ai_coach_model_manager.dart lib/ai_coach/local_llm_engine.dart android/app/src/main/kotlin/com/example/gymapp/MainActivity.kt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Harden AI model lifecycle against injected faults"
          git push origin HEAD:test/ai-model-fault-injection
