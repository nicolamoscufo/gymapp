name: Remove unused Home theme

on:
  push:
    branches:
      - refactor/workout-ui-foundation

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[remove-unused-home-theme]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/workout-ui-foundation
          fetch-depth: 0
      - name: Remove unused local
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/home.dart')
          text = p.read_text()
          old = "  Widget build(BuildContext context) {\n    final theme = Theme.of(context);\n    final isCoach = _currentIndex == 4;"
          new = "  Widget build(BuildContext context) {\n    final isCoach = _currentIndex == 4;"
          if old not in text:
              raise SystemExit('Home build anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "gymapp-refactor"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/home.dart
          git commit -m "Remove unused Home theme local [remove-unused-home-theme]"
          git push origin HEAD:refactor/workout-ui-foundation
