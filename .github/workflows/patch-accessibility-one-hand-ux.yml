name: Patch accessibility and one-hand UX

on:
  push:
    branches:
      - feat/accessibility-one-hand-ux

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/accessibility-one-hand-ux

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply accessibility patch
        run: python3 tool/patch_accessibility_one_hand_ux.py

      - name: Format
        run: dart format lib/screens/active_workout.dart lib/ui/active_workout_input_components.dart lib/ui/workout_components.dart test/accessibility_one_hand_ux_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run accessibility and affected workout tests
        run: flutter test test/accessibility_one_hand_ux_test.dart test/workout_ux_polish_v2_test.dart test/workout_components_test.dart test/screen_architecture_test.dart

      - name: Run full functional suite
        run: flutter test

      - name: Refresh intentional workout golden baselines
        env:
          GOLDEN_TESTS: '1'
        run: flutter test test/ui_visual_golden_test.dart --update-goldens

      - name: Verify visual baselines
        env:
          GOLDEN_TESTS: '1'
        run: flutter test test/ui_visual_golden_test.dart

      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/active_workout.dart lib/ui/active_workout_input_components.dart lib/ui/workout_components.dart test/accessibility_one_hand_ux_test.dart test/goldens
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Improve workout accessibility and one-hand controls"
          git push origin HEAD:feat/accessibility-one-hand-ux
