name: Fix UI material contracts

on:
  push:
    branches:
      - refactor/workout-ui-foundation

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[fix-ui-material-contracts]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/workout-ui-foundation
          fetch-depth: 0
      - name: Apply UI and test contract fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          home = Path('lib/screens/home.dart')
          text = home.read_text()

          patterns = [
              r"\n\s*decoration: BoxDecoration\(\n\s*color: schedule\.isArchived\n\s*\? Colors\.transparent\n\s*: colorScheme\.surfaceContainerLow,\n\s*\),",
              r"\n\s*decoration: BoxDecoration\(\n\s*color: colorScheme\.surfaceContainerLow,\n\s*\),",
          ]
          removed = 0
          for pattern in patterns:
              text, count = re.subn(pattern, '', text)
              removed += count
          if removed < 4:
              raise SystemExit(f'Expected at least 4 Home surface wrappers, removed {removed}')
          home.write_text(text)

          detail = Path('lib/screens/schedule_detail.dart')
          text = detail.read_text()
          text, count = re.subn(
              r"\n\s*decoration: BoxDecoration\(\n\s*color: colorScheme\.surfaceContainerLow,\n\s*\),",
              '',
              text,
          )
          if count < 1:
              raise SystemExit('Schedule detail surface wrapper not found')
          detail.write_text(text)

          nav_test = Path('test/home_navigation_test.dart')
          text = nav_test.read_text()
          replacements = {
              "await tester.tap(find.byIcon(Icons.list_alt));": "await tester.tap(\n      find.descendant(\n        of: find.byType(NavigationBar),\n        matching: find.text('Schede'),\n      ),\n    );",
              "await tester.tap(find.byIcon(Icons.calendar_month));": "await tester.tap(\n      find.descendant(\n        of: find.byType(NavigationBar),\n        matching: find.text('Allenati'),\n      ),\n    );",
              "await tester.tap(find.byIcon(Icons.history));": "await tester.tap(\n      find.descendant(\n        of: find.byType(NavigationBar),\n        matching: find.text('Progressi'),\n      ),\n    );",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Navigation test anchor not found: {old}')
              text = text.replace(old, new, 1)
          nav_test.write_text(text)

          undo = Path('test/home_undo_test.dart')
          text = undo.read_text()
          text = text.replace('of: find.byType(BottomNavigationBar)', 'of: find.byType(NavigationBar)')
          text = text.replace('matching: find.byIcon(Icons.calendar_month),', "matching: find.text('Allenati'),")
          text = text.replace('matching: find.byIcon(Icons.history),', "matching: find.text('Progressi'),")

          marker = "testWidgets('guided progression prefills next workout targets'"
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Guided progression test not found')
          schedule_start = text.find('final schedule = Schedule(', start)
          exercises_anchor = text.find('      exercises: [', schedule_start)
          segment = text[schedule_start:exercises_anchor]
          if 'deloadEveryWeeks:' not in segment:
              segment = segment.replace(
                  '      createdAt: DateTime(2026),\n',
                  '      createdAt: DateTime(2026),\n      deloadEveryWeeks: 0,\n',
                  1,
              )
              text = text[:schedule_start] + segment + text[exercises_anchor:]
          undo.write_text(text)
          PY
      - name: Commit fixes
        run: |
          git config user.name "gymapp-refactor"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/home.dart lib/screens/schedule_detail.dart test/home_navigation_test.dart test/home_undo_test.dart
          git commit -m "Fix Material surfaces and navigation tests [fix-ui-material-contracts]"
          git push origin HEAD:refactor/workout-ui-foundation
