name: Workout UX Polish v2

on:
  push:
    branches:
      - feature/workout-ux-polish-v2

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workout-ux-polish-v2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply active workout UX patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/active_workout.dart')
          text = path.read_text()

          method_marker = "  Future<void> _pickRpe(ExerciseSet set) async {"
          if "void _applyPreviousValuesForExercise" not in text:
              if text.count(method_marker) != 1:
                  raise SystemExit('previous-values insertion marker not found exactly once')
              helper = """  void _applyPreviousValuesForExercise(WorkoutExercise exercise) {
            var changed = false;
            setState(() {
              changed = _setManager.applyPreviousValues(exercise);
            });
            if (!changed) return;
            HapticFeedback.selectionClick();
            _saveCurrentSession();
          }

          """
              text = text.replace(method_marker, helper + method_marker)

          previous_start_marker = "                      if (exercise.previousWeights.isNotEmpty) ...["
          previous_end_marker = "                      if (_progressionHintFor(exercise) != null) ...["
          if "'use-previous-values-${exercise.id}'" not in text:
              previous_start = text.find(previous_start_marker)
              previous_end = text.find(previous_end_marker, previous_start)
              if previous_start < 0 or previous_end < 0:
                  raise SystemExit('previous-values UI markers not found')
              previous_ui_replacement = """                      if (exercise.previousWeights.isNotEmpty) ...[
                        const SizedBox(height: 6),
                        Row(
                          children: [
                            Expanded(
                              child: Text(
                                _formatPreviousWeights(exercise.previousWeights),
                                style: theme.textTheme.bodySmall?.copyWith(
                                  color: colorScheme.primary,
                                  fontWeight: FontWeight.w600,
                                ),
                              ),
                            ),
                            const SizedBox(width: 8),
                            ActionChip(
                              key: ValueKey(
                                'use-previous-values-${exercise.id}',
                              ),
                              avatar: const Icon(Icons.history, size: 16),
                              label: const Text('Usa precedenti'),
                              tooltip:
                                  'Carica kg e reps dell’ultima sessione nei set non completati',
                              visualDensity: VisualDensity.compact,
                              onPressed: () =>
                                  _applyPreviousValuesForExercise(exercise),
                            ),
                          ],
                        ),
                      ],
          """
              text = text[:previous_start] + previous_ui_replacement + text[previous_end:]

          if "'rest-preset-${exercise.id}'" not in text:
              rest_key = "key: ValueKey('rest-${exercise.id}')"
              rest_key_index = text.find(rest_key)
              if rest_key_index < 0:
                  raise SystemExit('rest field key not found')
              timer_start = text.rfind('                          SizedBox(', 0, rest_key_index)
              timer_end = text.find(
                  '                          IconButton(\n                            tooltip: activeRestSeconds == null',
                  rest_key_index,
              )
              if timer_start < 0 or timer_end < 0:
                  raise SystemExit('timer UI boundaries not found')
              timer_replacement = """                          SizedBox(
                            width: 88,
                            child: _StableSetTextField(
                              key: ValueKey('rest-${exercise.id}'),
                              text: _restController
                                  .configuredSecondsFor(exercise)
                                  .toString(),
                              keyboardType: TextInputType.number,
                              textAlign: TextAlign.center,
                              decoration: InputDecoration(
                                labelText: 'sec',
                                isDense: true,
                                contentPadding: const EdgeInsets.symmetric(
                                  horizontal: 8,
                                  vertical: 10,
                                ),
                                border: compactInputBorder,
                                enabledBorder: compactInputBorder,
                                focusedBorder: compactInputBorder.copyWith(
                                  borderSide: BorderSide(
                                    color: colorScheme.primary,
                                    width: 1.5,
                                  ),
                                ),
                              ),
                              onChanged: (value) =>
                                  _updateExerciseRestSeconds(exercise, value),
                            ),
                          ),
                          PopupMenuButton<int>(
                            key: ValueKey('rest-preset-${exercise.id}'),
                            tooltip: 'Preset recupero',
                            icon: const Icon(Icons.tune),
                            onSelected: (seconds) =>
                                _updateExerciseRestSeconds(
                                  exercise,
                                  seconds.toString(),
                                ),
                            itemBuilder: (context) => const [60, 90, 120, 180]
                                .map(
                                  (seconds) => PopupMenuItem<int>(
                                    value: seconds,
                                    child: Text('$seconds s'),
                                  ),
                                )
                                .toList(),
                          ),
          """
              text = text[:timer_start] + timer_replacement + text[timer_end:]

          path.write_text(text)
          PY

      - name: Format
        run: dart format lib/screens/active_workout.dart lib/active_workout_exercise_manager.dart lib/active_workout_set_manager.dart test/workout_ux_polish_v2_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run focused tests
        run: flutter test test/workout_ux_polish_v2_test.dart test/active_workout_exercise_manager_test.dart

      - name: Analyze
        run: dart analyze

      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/active_workout.dart lib/active_workout_exercise_manager.dart lib/active_workout_set_manager.dart test/workout_ux_polish_v2_test.dart
          git commit -m "Polish live workout logging UX"
          git push origin HEAD:feature/workout-ux-polish-v2
