name: Progress Analytics parity build

on:
  push:
    branches:
      - feat/progress-analytics-parity

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/progress-analytics-parity

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply integration patch
        run: python tool/progress_analytics_patch.py

      - name: Format
        run: dart format lib/progress_analytics.dart lib/screens/progress_center.dart lib/screens/home.dart lib/ai_coach/training_context_builder.dart lib/ai_coach/ai_coach_prompts.dart test/progress_analytics_test.dart test/progress_center_test.dart test/progress_ai_context_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit progress analytics parity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/progress_analytics.dart lib/screens/progress_center.dart lib/screens/home.dart lib/ai_coach/training_context_builder.dart lib/ai_coach/ai_coach_prompts.dart test/progress_analytics_test.dart test/progress_center_test.dart test/progress_ai_context_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "Build progress analytics parity"
          git push origin HEAD:feat/progress-analytics-parity
