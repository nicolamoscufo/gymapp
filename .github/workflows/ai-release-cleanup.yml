name: AI release cleanup

on:
  push:
    branches:
      - fix/ai-release-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/ai-release-cleanup

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch release readiness
        shell: python
        run: |
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in text:
              marker = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              text = text.replace(marker, permission + marker)
          manifest.write_text(text)

          settings = Path('lib/screens/settings.dart')
          text = settings.read_text()
          text = text.replace(
              'Gym App salva schede, storico, misure corpo e backup solo sul dispositivo. Non usa backend, account o chiamate di rete. Per spostare i dati usa export/import backup JSON.',
              'Gym App salva schede, storico, misure corpo e backup sul dispositivo. Non usa backend o account. La rete viene usata solo per scaricare il modello AI locale quando richiesto; allenamenti, profilo AI, chat e inferenza restano sul dispositivo. Per spostare i dati usa export/import backup JSON.',
          )
          text = text.replace(
              'Dati offline: niente account, server o tracking.',
              'Dati e AI locali: rete solo per il download del modello.',
          )
          settings.write_text(text)

          schedule = Path('lib/screens/schedule_detail.dart')
          text = schedule.read_text()
          text = text.replace(
              '    if (newIndex < 0 || newIndex > widget.schedule.exercises.length) {',
              '    if (newIndex < 0 || newIndex >= widget.schedule.exercises.length) {',
          )
          text = text.replace(
              '      final insertIndex = oldIndex < newIndex ? newIndex - 1 : newIndex;\n      widget.schedule.exercises.insert(insertIndex, exercise);',
              '      widget.schedule.exercises.insert(newIndex, exercise);',
          )
          text = text.replace(
              '              onReorder: _reorderExercise,',
              '              onReorderItem: _reorderExercise,',
          )
          schedule.write_text(text)

      - name: Resolve dependencies and refresh lockfile
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/AndroidManifest.xml lib/screens/settings.dart lib/screens/schedule_detail.dart pubspec.lock
          git diff --cached --quiet && exit 0
          git commit -m "Fix AI Android release readiness"
          git push origin HEAD:fix/ai-release-cleanup
