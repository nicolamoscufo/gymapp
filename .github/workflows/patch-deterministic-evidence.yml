name: Patch deterministic AI evidence

on:
  push:
    branches:
      - feature/ai-deterministic-evidence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ai-deterministic-evidence

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply deterministic evidence patch
        run: |
          python3 tool/patch_deterministic_evidence.py
          python3 tool/patch_verified_evidence_budget_fallback.py

      - name: Format
        run: dart format lib/ai_coach/ai_coach_verified_evidence.dart lib/ai_coach/training_context_builder.dart lib/ai_coach/ai_coach_context_router.dart lib/ai_coach/ai_coach_exercise_context.dart lib/ai_coach/ai_coach_context_budget.dart lib/ai_coach/local_ai_coach_service.dart lib/ai_coach/ai_coach_prompts.dart lib/ai_coach/ai_program_draft_service.dart test/ai_coach_verified_evidence_test.dart test/local_ai_coach_verified_evidence_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test deterministic evidence and AI evals
        run: flutter test test/ai_coach_verified_evidence_test.dart test/local_ai_coach_verified_evidence_test.dart test/ai_coach_exercise_context_test.dart test/local_ai_coach_exercise_focus_test.dart test/ai_coach_evaluation_suite_test.dart test/progress_ai_context_test.dart test/workout_experience_v4_test.dart test/workout_experience_v5_test.dart

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai_coach/ai_coach_verified_evidence.dart lib/ai_coach/training_context_builder.dart lib/ai_coach/ai_coach_context_router.dart lib/ai_coach/ai_coach_exercise_context.dart lib/ai_coach/ai_coach_context_budget.dart lib/ai_coach/local_ai_coach_service.dart lib/ai_coach/ai_coach_prompts.dart lib/ai_coach/ai_program_draft_service.dart test/ai_coach_verified_evidence_test.dart test/local_ai_coach_verified_evidence_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Make deterministic analytics first-class Coach evidence"
          git push origin HEAD:feature/ai-deterministic-evidence
