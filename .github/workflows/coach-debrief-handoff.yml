name: Coach Debrief Handoff

on:
  push:
    branches:
      - feature/coach-debrief-handoff

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coach-debrief-handoff

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Coach handoff patch
        run: |
          python3 .github/scripts/coach_handoff_patch.py
          python3 .github/scripts/coach_handoff_test_fix.py

      - name: Format
        run: dart format lib/ai_coach/ai_coach_handoff.dart lib/ai_coach/local_ai_coach_service.dart lib/post_workout_debrief.dart lib/screens/ai_coach.dart lib/screens/ai_coach_entry.dart lib/screens/session_summary.dart test/ai_coach_handoff_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run Coach handoff tests
        run: flutter test test/ai_coach_handoff_test.dart

      - name: Run AI Coach regressions
        run: flutter test test/ai_coach_test.dart

      - name: Run post-workout regressions
        run: flutter test test/post_workout_debrief_test.dart

      - name: Analyze
        run: dart analyze

      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai_coach/ai_coach_handoff.dart lib/ai_coach/local_ai_coach_service.dart lib/post_workout_debrief.dart lib/screens/ai_coach.dart lib/screens/ai_coach_entry.dart lib/screens/session_summary.dart test/ai_coach_handoff_test.dart
          git commit -m "Add full-context Coach debrief handoff"
          git push origin HEAD:feature/coach-debrief-handoff
