name: Next Session Plan Review

on:
  push:
    branches:
      - feature/next-session-plan-review

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/next-session-plan-review

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply next-session plan patch
        run: python3 .github/scripts/next_session_plan_patch.py

      - name: Format
        run: dart format lib/post_workout_next_session_plan.dart lib/screens/active_workout.dart lib/screens/session_summary.dart test/post_workout_next_session_plan_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run next-session plan tests
        run: flutter test test/post_workout_next_session_plan_test.dart

      - name: Run schedule sync regressions
        run: flutter test test/active_workout_schedule_sync_test.dart test/active_workout_session_builder_test.dart

      - name: Run post-workout regressions
        run: flutter test test/post_workout_debrief_test.dart test/ai_coach_handoff_test.dart

      - name: Analyze
        run: dart analyze

      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/post_workout_next_session_plan.dart lib/screens/active_workout.dart lib/screens/session_summary.dart test/post_workout_next_session_plan_test.dart
          git commit -m "Add reviewed next-session plan flow"
          git push origin HEAD:feature/next-session-plan-review
