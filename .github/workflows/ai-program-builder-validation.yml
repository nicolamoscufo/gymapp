name: AI Program Builder Validation

on:
  push:
    branches:
      - feature/ai-program-builder-chat

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Full test suite
        run: flutter test
