name: Patch AI Coach context budget

on:
  push:
    branches:
      - test/ai-coach-evals

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test/ai-coach-evals

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply budget patch
        run: python3 tool/patch_ai_coach_context_budget.py

      - name: Format
        run: dart format lib/ai_coach/local_ai_coach_service.dart lib/ai_coach/ai_coach_context_budget.dart

      - name: Analyze
        run: flutter analyze

      - name: Run Coach evaluation suite
        run: flutter test test/ai_coach_evaluation_suite_test.dart

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai_coach/local_ai_coach_service.dart lib/ai_coach/ai_coach_context_budget.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Enforce hard AI Coach context budget"
          git push origin HEAD:test/ai-coach-evals
