name: Progress Center Intelligence v1

on:
  push:
    branches:
      - feature/progress-center-intelligence-v1

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/progress-center-intelligence-v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply Progress Center Focus UI
        run: python3 .github/scripts/add_progress_center_focus.py
      - name: Format
        run: dart format lib/progress_intelligence.dart lib/screens/progress_center.dart test/progress_intelligence_test.dart test/progress_center_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Run Progress Center intelligence tests
        run: flutter test test/progress_intelligence_test.dart test/progress_center_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/progress_center.dart test/progress_center_test.dart lib/progress_intelligence.dart test/progress_intelligence_test.dart
          git commit -m "Add actionable Progress Center intelligence"
          git push origin HEAD:feature/progress-center-intelligence-v1
